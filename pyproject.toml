[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tai-rhinestone-studio"
version = "0.1.0"
description = "Rhinestone Studio — convert images into editable rhinestone designs and export production-ready files."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Proprietary" }
authors = [{ name = "Tai" }]
keywords = ["rhinestone", "cricut", "svg", "dxf", "craft", "design"]

dependencies = [
    "PySide6>=6.11",
    "numpy>=2.0",
    "opencv-python-headless>=4.9",
    "Pillow>=10.0",
    "ezdxf>=1.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[project.gui-scripts]
rhinestone-studio = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.resources" = ["icons/*", "styles/*", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"
